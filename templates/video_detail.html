<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📹 Your Thought - {{ base_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container video-detail-container">
        <header class="page-header">
            <a href="/videos" class="back-button">← Back to Thoughts</a>
            <h1 class="main-title">Your Thought</h1>
            <p class="subtitle" id="video-date"></p>
        </header>
        
        <main class="video-detail-content">
            <section class="video-player-section">
                <div class="video-player-container">
                    <video id="videoPlayer" controls preload="metadata">
                        <source src="{{ url_for('download_file', filename=video_file) }}" type="video/webm">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </section>
            
            <section class="transcript-section">
                <header class="transcript-header">
                    <h2 class="transcript-title">Transcript</h2>
                    <div class="transcript-meta">
                        <span class="transcript-length" id="transcript-length"></span>
                    </div>
                </header>
                
                <div class="transcript-content">
                    <pre id="transcript-text">{{ transcript_content }}</pre>
                </div>
            </section>
        </main>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Format date
            const timestamp = {{ creation_time }};
            const date = new Date(timestamp * 1000);
            const formattedDate = date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('video-date').textContent = formattedDate;
            
            // Calculate transcript length
            const transcriptText = document.getElementById('transcript-text').textContent;
            const wordCount = transcriptText.trim().split(/\s+/).length;
            const readingTime = Math.ceil(wordCount / 200); // Average reading speed
            document.getElementById('transcript-length').textContent = `${wordCount} words • ${readingTime} min read`;
            
            // Video player enhancements
            const videoPlayer = document.getElementById('videoPlayer');
            
            // Add keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    return;
                }
                
                switch(e.code) {
                    case 'Space':
                        e.preventDefault();
                        videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 10);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        videoPlayer.currentTime = Math.min(videoPlayer.duration, videoPlayer.currentTime + 10);
                        break;
                    case 'KeyF':
                        e.preventDefault();
                        if (document.fullscreenElement) {
                            document.exitFullscreen();
                        } else {
                            videoPlayer.requestFullscreen().catch(err => {
                                console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                            });
                        }
                        break;
                }
            });
        });
    </script>
</body>
</html>
