<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎥 AI Video Recorder - What's on your mind?</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 class="main-title">What's on your mind?</h1>
        </header>

        <main class="recorder-content">
            <section class="video-container">
                <video id="preview" autoplay muted playsinline></video>
            </section>
            
            <section class="controls">
                <button id="recordButton" class="dreamy-record-btn">
                    <div class="button-content">
                        <div class="button-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                                <circle cx="12" cy="12" r="3" fill="currentColor"/>
                            </svg>
                        </div>
                        <span class="button-text">Share Your Thoughts</span>
                    </div>
                </button>
            </section>
        </main>

        <footer class="page-footer">
            <nav class="navigation-links">
                <a href="/videos" class="nav-link">View Past Thoughts →</a>
            </nav>
            <div id="status" class="status-text"></div>
            <div id="recording-link" class="download-links"></div>
        </footer>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
